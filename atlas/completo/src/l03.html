<!-- titulo:L03 -->

<!-- Plantilla de la vista previa de un estilo (la clona ac-estilo; fuera de las diapositivas) -->
<template id="ac-plantilla-estilo">
  <header class="s-head"><p class="kicker">vista previa</p><h2 class="s-title">Título de muestra</h2></header>
  <div class="s-body ac-prev-cuerpo">
    <div class="panel ac-prev-panel"><p class="label">velocidad lineal</p><p class="value">0,42 <small>m/s</small></p>
      <div class="ac-prev-barras"><i style="--h:.7;background:var(--cat-1)"></i><i style="--h:.5;background:var(--cat-2)"></i><i style="--h:.9;background:var(--cat-3)"></i><i style="--h:.35;background:var(--cat-4)"></i><i style="--h:.6;background:var(--cat-5)"></i><i style="--h:.45;background:var(--cat-6)"></i></div></div>
    <div class="stack"><p class="lead">Texto principal con un <b style="color:var(--accent-ink)">acento</b>.</p>
      <p class="row"><span class="chip"><b style="color:var(--ok)">●</b> ok · listo</span><span class="chip"><b style="color:var(--warn)">●</b> aviso</span><span class="chip"><b style="color:var(--err)">●</b> error</span></p>
      <div class="term">$ ros2 run nav2 planner<br>[INFO] listo</div></div>
  </div>
</template>
